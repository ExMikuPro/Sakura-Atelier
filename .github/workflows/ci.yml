name: CI

on:
  push:
    branches: [dev, EXP/macos-ci-validation]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - name: Install UI test browser
        run: npx playwright install firefox
      - run: npm run test:ui

  integration:
    name: Integration tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: npm ci
      - name: Run Extension Host integration tests
        run: npm run test:integration
      - name: Verify host-isolated SDK discovery
        run: node scripts/integration-p1.cjs p1-a
      - name: Verify Python environment creation and rediscovery
        run: node scripts/integration-p1.cjs p1-b
      - name: Verify read-only project dependency diagnosis
        run: node scripts/integration-p1.cjs p1-c
      - name: Run actual new-project wizard UI in stable VS Code
        run: npm run test:wizard

  package:
    name: Package VSIX
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sakura-atelier-vsix
          path: "*.vsix"
          if-no-files-found: error
