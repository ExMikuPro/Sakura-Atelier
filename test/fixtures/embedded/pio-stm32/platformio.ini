; STM32 project with two environments sharing options.
[platformio]
default_envs = nucleo_f401re

[env]
framework = stm32cube
monitor_speed = 115200

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
upload_protocol = stlink
debug_tool = stlink

[stm32l4_base]
platform = ststm32@^17.0.0
board = nucleo_l476rg

[env:nucleo_l476rg]
extends = stm32l4_base
upload_protocol = stlink
